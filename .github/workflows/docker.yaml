name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q tests/

      - name: Lint with ruff
        run: |
          pip install ruff==0.16.1
          ruff check .

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy *.py

      - name: Validate syntax
        run: python -m compileall -q *.py ocrmypdf_paddleocr tests

  filter:
    name: Filter (OCR-related changes)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      ocr_related: ${{ steps.paths.outputs.ocr_related }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the diff base (pre-push SHA / PR base) resolves

      # dorny/paths-filter is not mirrored on data.forgejo.org, so the path
      # filter is implemented inline (plain git diff) — no third-party action
      # needed, and the job runs identically on GitHub Actions and the
      # Forgejo/act runner.
      - name: Check for OCR-related changes
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Changed files, depending on the triggering event.
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ] \
             && git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
            changed=$(git diff --name-only "$base" HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # New branch / first push: diff against the empty tree.
            empty_tree=$(git mktree < /dev/null)
            changed=$(git diff --name-only "$empty_tree" HEAD)
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA" HEAD)
          elif git rev-parse --verify --quiet "HEAD~1" >/dev/null; then
            changed=$(git diff --name-only "HEAD~1" HEAD)
          else
            changed=""
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          # OCR-related paths (same list as the old dorny/paths-filter config).
          related=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              paddlex_helpers.py|worker.py|server.py|Dockerfile|requirements.txt|.github/workflows/docker.yaml|ocrmypdf_paddleocr/*|tests/e2e/*|tests/fixtures/*)
                related=true
                ;;
            esac
          done <<< "$changed"

          echo "ocr_related=$related" >> "$GITHUB_OUTPUT"

  e2e-ocr:
    name: E2E OCR (umlaut regression)
    # Runs in parallel with `test` (does not wait for it, so the cold
    # image build overlaps the unit tests) and is gated on success() of
    # the `filter` job: runs when OCR-affecting files changed, or on
    # release events (filter is skipped on release, and success() over
    # the single skipped need is satisfied). A skipped e2e-ocr does NOT
    # block publishing (publish jobs gate on success(), which treats
    # skipped needs as satisfied); a FAILED e2e-ocr does block publishing.
    needs: [filter]
    if: |
      success() && (needs.filter.outputs.ocr_related == 'true' ||
        github.event_name == 'release')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          cache_args=""
          # GHA build cache is GitHub-only; Forgejo's buildx has no `gha`
          # cache type and would fail the build with it.
          if [ "$GITHUB_SERVER_URL" = "https://github.com" ]; then
            cache_args="--cache-from type=gha --cache-to type=gha,mode=max"
          fi
          # shellcheck disable=SC2086
          docker build $cache_args -t doc-worker:e2e .

      - name: Run umlaut e2e
        run: |
          docker run --rm \
            -w /app \
            -e PYTHONPATH=/app \
            -v $PWD/tests/e2e:/e2e:ro \
            -v $PWD/tests/fixtures:/fixtures:ro \
            doc-worker:e2e \
            python /e2e/umlaut_e2e.py

  should-push:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.push_check.outputs.should_push }}
    steps:
      - id: push_check
        run: |
          if [ "${{github.event_name}}" = "release" ] && [ "${{github.event.action}}" = "published" ]; then
            echo "should_push=true"
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi
     
  publish-cpu:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cuda:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cpu-gchr:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
  publish-cuda-gchr:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
