name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The pre-baked act runner image may lack the system libraries that
      # `import paddlex` needs (cv2 -> libGL/libglib, paddle -> libgomp).
      # Without them the PaddleX import fails partway through __init__, and
      # CPython's import rollback leaves the repo_manager submodules behind
      # in an initialized state — any later re-import then raises "PDX has
      # already been initialized".  These are the same libraries the
      # Dockerfile ships; on GHA's ubuntu-latest the install is a no-op.
      - name: Install system libraries for PaddleX import
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update -qq
          PKGS="libgl1 libgomp1"
          if $SUDO apt-cache show libglib2.0-0t64 >/dev/null 2>&1; then
            PKGS="$PKGS libglib2.0-0t64"  # Ubuntu 24.04+
          else
            PKGS="$PKGS libglib2.0-0"     # Ubuntu 22.04
          fi
          # shellcheck disable=SC2086
          $SUDO apt-get install -y -qq --no-install-recommends $PKGS

      - name: Verify PaddleX import (diagnostic)
        run: |
          python -c "import paddlex; print('paddlex import OK:', paddlex.__version__)" \
            || echo "::warning::PaddleX import failed — unit tests will run in degraded (mock-only) mode"

      - name: Run unit tests
        run: python -m pytest -q tests/

      - name: Lint with ruff
        run: |
          pip install ruff==0.16.1
          ruff check .

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy *.py

      - name: Validate syntax
        run: python -m compileall -q *.py ocrmypdf_paddleocr tests

  filter:
    name: Filter (OCR-related changes)
    # No `if:` on this job. Forgejo's run creation for `release` events
    # silently drops jobs whose `if:` it resolves to false (or that reference
    # `needs.*` of a skipped job — see Forgejo issue #14684, "reusable
    # workflow / if evaluation errors only logged server-side"): in release
    # runs this job and e2e-ocr vanished entirely, and the publish gate then
    # no-opped with zero output. The release case is handled in-step instead.
    runs-on: ubuntu-latest
    outputs:
      ocr_related: ${{ steps.paths.outputs.ocr_related }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the diff base (pre-push SHA / PR base) resolves

      # dorny/paths-filter is not mirrored on data.forgejo.org, so the path
      # filter is implemented inline (plain git diff) — no third-party action
      # needed, and the job runs identically on GitHub Actions and the
      # Forgejo/act runner.
      - name: Check for OCR-related changes
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Release events carry no diff base and no before-SHA; the filter
          # is meaningless there (e2e-ocr runs unconditionally on release).
          if [ "$EVENT" = "release" ]; then
            echo "ocr_related=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Changed files, depending on the triggering event.
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ] \
             && git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
            changed=$(git diff --name-only "$base" HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # New branch / first push: diff against the empty tree.
            empty_tree=$(git mktree < /dev/null)
            changed=$(git diff --name-only "$empty_tree" HEAD)
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA" HEAD)
          elif git rev-parse --verify --quiet "HEAD~1" >/dev/null; then
            changed=$(git diff --name-only "HEAD~1" HEAD)
          else
            changed=""
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          # OCR-related paths (same list as the old dorny/paths-filter config).
          related=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              paddlex_helpers.py|worker.py|server.py|Dockerfile|requirements.txt|.github/workflows/docker.yaml|ocrmypdf_paddleocr/*|tests/e2e/*|tests/fixtures/*)
                related=true
                ;;
            esac
          done <<< "$changed"

          echo "ocr_related=$related" >> "$GITHUB_OUTPUT"

  e2e-ocr:
    name: E2E OCR (umlaut regression)
    # Runs in parallel with `test` (does not wait for it, so the cold
    # image build overlaps the unit tests) and is gated on the `filter`
    # job's output: runs when OCR-affecting files changed, or on release
    # events (filter reports ocr_related=false on release, the gate below
    # treats release unconditionally as "run"). The gate is in-step, not
    # an `if:` — see the comment on `filter` for why (Forgejo release
    # events drop jobs with `if:` referencing needs.* of skipped jobs).
    # When not required, the job exits 0 (a no-op success) and does NOT
    # block publishing; a FAILED e2e-ocr does block publishing.
    needs: [filter]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        env:
          EVENT: ${{ github.event_name }}
          OCR_RELATED: ${{ needs.filter.outputs.ocr_related }}
          DOCKER_BUILDKIT: 1
        run: |
          if [ "$EVENT" != "release" ] && [ "$OCR_RELATED" != "true" ]; then
            echo "e2e not required (event=$EVENT, ocr_related=$OCR_RELATED) — skipping"
            exit 0
          fi
          cache_args=""
          # GHA build cache is GitHub-only; Forgejo's buildx has no `gha`
          # cache type and would fail the build with it.
          if [ "$GITHUB_SERVER_URL" = "https://github.com" ]; then
            cache_args="--cache-from type=gha --cache-to type=gha,mode=max"
          fi
          # shellcheck disable=SC2086
          docker build $cache_args -t doc-worker:e2e .

      - name: Run umlaut e2e
        env:
          EVENT: ${{ github.event_name }}
          OCR_RELATED: ${{ needs.filter.outputs.ocr_related }}
        run: |
          if [ "$EVENT" != "release" ] && [ "$OCR_RELATED" != "true" ]; then
            echo "e2e not required (event=$EVENT, ocr_related=$OCR_RELATED) — skipping"
            exit 0
          fi

          # Run the e2e from the image's own copy of the repo
          # (COPY . . -> /app/tests). No bind mounts: on the Forgejo/act
          # runner the docker daemon may not share the job container's
          # filesystem, so -v $PWD/... resolves to an empty directory
          # ("can't open file '/e2e/umlaut_e2e.py'"). The image was just
          # built from this commit, so the in-image copy is the exact
          # code under test.
          docker run --rm \
            -w /app \
            -e PYTHONPATH=/app \
            doc-worker:e2e \
            python /app/tests/e2e/umlaut_e2e.py

  should-push:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.push_check.outputs.should_push }}
    steps:
      - id: push_check
        run: |
          if [ "${{github.event_name}}" = "release" ] && [ "${{github.event.action}}" = "published" ]; then
            echo "should_push=true"
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi
     
  publish-cpu:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cuda:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cpu-gchr:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
  publish-cuda-gchr:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
