name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q tests/

      - name: Lint with ruff
        run: |
          pip install ruff==0.16.1
          ruff check .

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy *.py

      - name: Validate syntax
        run: python -m compileall -q *.py ocrmypdf_paddleocr tests

  filter:
    name: Filter (OCR-related changes)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      ocr_related: ${{ steps.paths.outputs.ocr_related }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4 (tag v3, PGP-verified by GitHub)
        id: paths
        with:
          filters: |
            ocr_related:
              - 'paddlex_helpers.py'
              - 'ocrmypdf_paddleocr/**'
              - 'worker.py'
              - 'server.py'
              - 'paddleocr_helpers.py'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'tests/e2e/**'
              - 'tests/fixtures/**'
              - '.github/workflows/docker.yaml'

  e2e-ocr:
    name: E2E OCR (umlaut regression)
    # Runs in parallel with `test` (does not wait for it, so the cold
    # image build overlaps the unit tests) and is gated on success() of
    # the `filter` job: runs when OCR-affecting files changed, or on
    # release events (filter is skipped on release, and success() over
    # the single skipped need is satisfied). A skipped e2e-ocr does NOT
    # block publishing (publish jobs gate on success(), which treats
    # skipped needs as satisfied); a FAILED e2e-ocr does block publishing.
    needs: [filter]
    if: |
      success() && (needs.filter.outputs.ocr_related == 'true' ||
        github.event_name == 'release')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          cache_args=""
          # GHA build cache is GitHub-only; Forgejo's buildx has no `gha`
          # cache type and would fail the build with it.
          if [ "$GITHUB_SERVER_URL" = "https://github.com" ]; then
            cache_args="--cache-from type=gha --cache-to type=gha,mode=max"
          fi
          # shellcheck disable=SC2086
          docker build $cache_args -t doc-worker:e2e .

      - name: Run umlaut e2e
        run: |
          docker run --rm \
            -w /app \
            -e PYTHONPATH=/app \
            -v $PWD/tests/e2e:/e2e:ro \
            -v $PWD/tests/fixtures:/fixtures:ro \
            doc-worker:e2e \
            python /e2e/umlaut_e2e.py

  should-push:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.push_check.outputs.should_push }}
    steps:
      - id: push_check
        run: |
          if [ "${{github.event_name}}" = "release" ] && [ "${{github.event.action}}" = "published" ]; then
            echo "should_push=true"
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi
     
  publish-cpu:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cuda:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cpu-gchr:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
  publish-cuda-gchr:
    needs: [test, filter, should-push, e2e-ocr]
    if: success() && github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
