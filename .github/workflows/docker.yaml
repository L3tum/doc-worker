name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check *.py

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy *.py

      - name: Validate syntax
        run: python -c "import ast; [ast.parse(open(f).read()) for f in __import__('glob').glob('*.py')]"

  should-push:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.push_check.outputs.should_push }}
    steps:
      - id: push_check
        run: |
          if [ "${{github.event_name}}" = "release" ] && [ "${{github.event.action}}" = "published" ]; then
            echo "should_push=true"
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi
     
  publish-cpu:
    needs: [test, should-push]
    if: github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cuda:
    needs: [test, should-push]
    if: github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  publish-cpu-gchr:
    needs: [test, should-push]
    if: github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      PUSH: ${{ needs.should-push.outputs.should_push }}
      RELEASE_TAG: "cpu"
  publish-cuda-gchr:
    needs: [test, should-push]
    if: github.server_url == 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-gchr.yml@main
    with:
      BUILD_ARGS_JSON: |
        {
          "PADDLE_GPU": "cuda"
        }
      PUSH_LATEST: false
      RELEASE_TAG: "cuda"
      PUSH: ${{ needs.should-push.outputs.should_push }}
